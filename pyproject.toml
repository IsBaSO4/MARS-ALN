[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-aln-pcr"
version = "1.0.0"
description = "MARS: Multi-region Attentive Representation with Shared-Specific decomposition for axillary lymph node pCR prediction from multi-region multi-timepoint DCE-MRI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.21,<2.0",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "nibabel>=4.0",
    "openpyxl>=3.0",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
n4 = ["SimpleITK>=2.2"]   # only for optional N4 bias-field correction
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
